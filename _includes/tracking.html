<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  (function () {
    var KEY = 'p3d-consent';
    var PIXEL_ID = '2670185473419347';
    var LISTING = 'bigcommerce.com/apps/product-3d-ar-by-papathemes';
    var EU_ATLANTIC = ['Atlantic/Reykjavik', 'Atlantic/Canary', 'Atlantic/Madeira', 'Atlantic/Azores'];
    var GRANTED = { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' };
    var DENIED = { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied' };

    function readChoice() {
      try {
        var v = window.localStorage.getItem(KEY);
        return v === 'granted' || v === 'denied' ? v : null;
      } catch (e) {
        return null;
      }
    }

    function writeChoice(v) {
      try {
        if (v) window.localStorage.setItem(KEY, v);
        else window.localStorage.removeItem(KEY);
      } catch (e) {
        return false;
      }
      return true;
    }

    function inEurope() {
      var tz = '';
      try {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {
        tz = '';
      }
      return tz.indexOf('Europe/') === 0 || EU_ATLANTIC.indexOf(tz) !== -1;
    }

    function loadPixel() {
      if (window.fbq) {
        window.fbq('consent', 'grant');
        return;
      }
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', PIXEL_ID);
      window.fbq('track', 'PageView');
    }

    function apply(granted) {
      gtag('consent', 'update', granted ? GRANTED : DENIED);
      if (granted) loadPixel();
      else if (window.fbq) window.fbq('consent', 'revoke');
    }

    var europe = inEurope();
    var choice = readChoice();

    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });
    if (choice === 'granted' || (choice === null && !europe)) apply(true);

    var tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18590867349';
    document.head.appendChild(tag);
    gtag('js', new Date());
    gtag('config', 'AW-18590867349');

    document.addEventListener('click', function (e) {
      var link = e.target && e.target.closest ? e.target.closest('a[href*="' + LISTING + '"]') : null;
      if (!link) return;
      gtag('event', 'conversion', { send_to: 'AW-18590867349/no2cCMfk3r0dEJW_6KBF' });
      if (window.fbq) window.fbq('track', 'Lead');
    }, true);

    window.p3dConsent = {
      europe: europe,
      choice: readChoice,
      set: function (v) {
        writeChoice(v);
        apply(v === 'granted');
      },
      reset: function () {
        writeChoice(null);
      }
    };
  })();
</script>
